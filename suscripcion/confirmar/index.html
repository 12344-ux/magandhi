<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar suscripción · MAGANDHI</title>
<meta name="robots" content="noindex, nofollow">
<!-- El token va en el fragmento (#t=): el navegador no lo envía a ningún servidor.
     no-referrer: tampoco sale hacia otros sitios si la persona hace clic. -->
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../../favicon.png?v=4">
<meta name="theme-color" content="#A6332E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../marca.css?v=3">
<!--
  MAGANDHI · Confirmación de suscripción (EM6). Copy PROVISIONAL.
  Lee #t=<token>, lo borra de la barra de direcciones de inmediato y lo manda a
  la Edge Function em-suscripcion (modo confirmar). Estados: confirmado,
  ya_confirmado, vencido, invalido, no_disponible.
-->
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Poppins,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--fondo-pagina,#EFE7DD);color:#111;min-height:100vh;display:flex;flex-direction:column}
  .cf-head{background:#fff;border-bottom:1px solid rgba(17,17,17,.08)}
  .cf-head a{max-width:1000px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:10px;text-decoration:none;color:#111}
  .cf-head img{width:34px;height:34px}
  .cf-head b{font-weight:600;letter-spacing:.2em;font-size:15px}
  .cf-head b i{font-style:normal;color:var(--red-500,#A6332E)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .cf-card{background:#fff;border-radius:16px;padding:36px 32px;max-width:460px;width:100%;text-align:center}
  .cf-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--red-50,#FBF1F0);color:var(--red-500,#A6332E)}
  .cf-ico svg{width:26px;height:26px}
  h1{margin:0 0 10px;font-size:22px;font-weight:600;line-height:1.3}
  p{margin:0 0 18px;font-size:14.5px;line-height:1.65;color:var(--gray-500,#6B6660)}
  .cf-btn{display:inline-block;font-weight:600;font-size:15px;color:#fff;background:var(--red-500,#A6332E);border-radius:10px;padding:13px 24px;text-decoration:none}
  .cf-btn:hover{background:var(--red-700,#7A2A26)}
  .cf-cargando .cf-ico{animation:cf-p 1.2s ease-in-out infinite}
  @keyframes cf-p{50%{opacity:.4}}
</style>
</head>
<body>
<header class="cf-head"><a href="../../index.html" aria-label="MAGANDHI, inicio"><img src="../../logo-mark-terracota.png" alt=""><b>MAG<i>A</i>NDHI</b></a></header>
<main>
  <div class="cf-card cf-cargando" id="cf" role="status" aria-live="polite">
    <div class="cf-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg></div>
    <h1>Confirmando tu suscripción…</h1>
    <p>Un momento.</p>
  </div>
</main>
<script type="module">
  import { supabase } from '../../supabase-config.js';
  const caja = document.getElementById('cf');
  const OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  const AL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  const ESTADOS = {
    confirmado:    [OK, 'Suscripción confirmada', 'Listo: desde ahora te contamos primero lo que escogemos. Puedes dejar de recibir los correos cuando quieras desde el enlace que trae cada uno.', 'Ir a la tienda', '../../index.html'],
    ya_confirmado: [OK, 'Ya estaba confirmada', 'Tu suscripción ya estaba activa. No tienes que hacer nada más.', 'Ir a la tienda', '../../index.html'],
    vencido:       [AL, 'El enlace venció', 'Por seguridad, cada enlace dura 48 horas. Pide uno nuevo desde la tienda.', 'Pedir un enlace nuevo', '../../index.html#mg-suscripcion'],
    invalido:      [AL, 'Enlace no válido', 'Este enlace no es válido o está incompleto. Ábrelo directamente desde el correo, o pide uno nuevo en la tienda.', 'Ir a la tienda', '../../index.html#mg-suscripcion'],
    no_disponible: [AL, 'No pudimos activarla', 'Esta dirección no puede recibir nuestros correos. Si crees que es un error, escríbenos a contacto@magandhi.com.', 'Ir a la tienda', '../../index.html'],
    error:         [AL, 'Algo falló', 'No pudimos confirmar ahora. Vuelve a abrir el enlace del correo en unos minutos.', 'Ir a la tienda', '../../index.html']
  };
  function pintar(k) {
    const [ico, t, p, b, href] = ESTADOS[k] || ESTADOS.error;
    caja.classList.remove('cf-cargando');
    caja.innerHTML = '<div class="cf-ico">' + ico + '</div><h1>' + t + '</h1><p>' + p + '</p><a class="cf-btn" href="' + href + '">' + b + '</a>';
    document.title = t + ' · MAGANDHI';
  }
  const token = new URLSearchParams(location.hash.slice(1)).get('t') || '';
  history.replaceState(null, '', location.pathname); // el token no queda en el historial ni se comparte por error
  if (!/^[A-Za-z0-9_-]{20,100}$/.test(token)) pintar('invalido');
  else {
    try {
      const { data, error } = await supabase.functions.invoke('em-suscripcion', { body: { modo: 'confirmar', token } });
      pintar(error ? 'error' : (data && data.estado) || 'error');
    } catch (_) { pintar('error'); }
  }
</script>
</body>
</html>
