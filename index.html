<!--
  MAGANDHI · portada provisional (fase de construcción)
  · CSS autocontenido en este <style>. Sin dependencias externas salvo la fuente.
  · Marca: rojo #D32F2F como acento sobre base neutra. Logo bolsa/domo/montaña.
  · Contenido de texto PROVISIONAL: sirve solo para ver la marca al conectar el
    dominio. Los copys definitivos se trabajan después (decisión del dueño).
-->
<style>
  *{box-sizing:border-box}
  :root{
    --rojo:#D32F2F;
    --rojo-osc:#B02525;
    --negro:#111111;
    --blanco:#FFFFFF;
    --hueso:#FAF7F5;
    --gris:#6B6B6B;
  }
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--hueso);
    color:var(--negro);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 22px;
  }
  .logo{width:104px;height:104px;display:block;margin:0 auto 22px auto}
  .wordmark{
    font-weight:600;font-size:clamp(30px,7vw,46px);letter-spacing:.22em;
    color:var(--negro);line-height:1;white-space:nowrap;margin:0;
  }
  .wordmark i{color:var(--rojo);font-style:normal}
  .kicker{
    display:inline-block;margin-top:26px;
    font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--rojo);font-weight:600;border:1px solid rgba(211,47,47,.28);
    border-radius:999px;padding:6px 15px;background:rgba(211,47,47,.05);
  }
  p{font-size:15.5px;color:var(--gris);max-width:440px;margin:20px auto 0 auto}
  footer{
    position:fixed;bottom:0;left:0;right:0;
    padding:18px;font-size:12px;color:#9A9A9A;
  }
</style>
</head>
<body>

  <img class="logo" src="logo-mark.png" alt="MAGANDHI" width="104" height="104">
  <h1 class="wordmark">MAG<i>A</i>NDHI</h1>

  <span class="kicker">Muy pronto</span>
  <p>Estamos construyendo la tienda. Con calma y bien hecho.</p>

  <footer>MAGANDHI · magandhi.com</footer>

</body>
</html>
