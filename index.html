<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magandhi</title>
<meta name="description" content="MAGANDHI es una tienda con productos escogidos uno a uno. Cada cosa que ves aquí fue revisada por el equipo antes de ofrecerla.">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="icono-app-180.png?v=2">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#A6332E">

<meta property="og:type" content="website">
<meta property="og:site_name" content="MAGANDHI">
<meta property="og:url" content="https://magandhi.com/">
<meta property="og:title" content="Magandhi">
<meta property="og:description" content="Una tienda con productos escogidos uno a uno y revisados por el equipo.">
<meta property="og:image" content="https://magandhi.com/logo.png">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="marca.css?v=1">

<!--
  MAGANDHI · portada / hero de la tienda.
  · CSS autocontenido, prefijo hg-. Sin dependencias salvo la fuente.
  · Sistema de marca: rojo #D32F2F, negro #111, hueso #FAF7F5, Poppins.
  · Idea de diseño: el rojo manda pero ENMARCADO (panel/vitrina), no a pantalla
    completa (a pantalla completa lee como "outlet"). El producto respira = lujo.
  · Fase 1: UN solo producto destacado, "Elegido por MAGANDHI". El vacío es intencional.
  · Barra fija inferior: solo Contacto (centrado).
-->
<style>
  *{box-sizing:border-box}
  /* La paleta vive en marca.css (fuente única). Aquí solo lo específico del hero. */
  :root{ --barra-h:60px; }
  html,body{margin:0;padding:0}
  body{
    background:var(--hueso);color:var(--tinta);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased;
    padding-bottom:var(--barra-h);
  }
  a{color:inherit;text-decoration:none}

  /* ---------- header ---------- */
  .hg-head{
    display:flex;align-items:center;justify-content:center;
    padding:26px 24px 6px;
  }
  .hg-marca{display:flex;flex-direction:column;align-items:center;gap:12px}
  .hg-marca img{width:76px;height:76px;display:block}
  /* wordmark: todo negro, centrado y AJUSTADO (letter-spacing menor = letras juntas) */
  .hg-word{
    font-weight:600;font-size:26px;letter-spacing:.16em;color:var(--negro);
    line-height:1;text-indent:.16em; /* compensa el spacing del último caracter para centrar óptico */
  }
  .hg-tag{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gris-cl);text-indent:.26em}

  /* ---------- intro corta ---------- */
  .hg-intro{max-width:620px;margin:14px auto 0;padding:0 24px;text-align:center}
  .hg-intro h1{
    font-size:clamp(24px,4vw,34px);font-weight:600;line-height:1.22;margin:0;letter-spacing:-.4px;
  }
  .hg-intro h1 em{font-style:normal;color:var(--rojo)}

  /* ---------- vitrina del producto (el hero) ---------- */
  .hg-vitrina{
    max-width:980px;margin:38px auto 0;padding:0 24px;
  }
  .hg-tarjeta{
    display:block;position:relative;border-radius:22px;overflow:hidden;
    background:var(--blanco);border:1px solid var(--linea);
    box-shadow:0 18px 46px rgba(17,17,17,.08);
    transition:transform .22s ease,box-shadow .22s ease;
    cursor:pointer;
  }
  .hg-tarjeta:hover{transform:translateY(-6px);box-shadow:0 30px 66px rgba(158,32,32,.20)}
  .hg-tarjeta:hover .hg-foto img{transform:scale(1.045)}
  .hg-tarjeta:hover .hg-ir{background:var(--rojo-osc);gap:12px}

  .hg-grid{display:grid;grid-template-columns:1.05fr 1fr;min-height:440px}
  @media(max-width:760px){.hg-grid{grid-template-columns:1fr}}

  /* panel rojo (fondo protagonista, ENMARCADO por la tarjeta) */
  .hg-foto{
    position:relative;
    background:
      radial-gradient(120% 90% at 50% 0%, var(--rojo) 0%, var(--rojo-osc) 62%, var(--rojo-prof) 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .hg-foto::after{ /* halo suave detrás del producto */
    content:"";position:absolute;width:78%;height:78%;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 68%);
  }
  .hg-foto img{
    position:relative;max-height:400px;max-width:80%;object-fit:contain;
    filter:drop-shadow(0 22px 30px rgba(0,0,0,.28));
    transition:transform .35s ease;z-index:1;
  }
  .hg-medalla{
    position:absolute;top:16px;left:16px;z-index:2;
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.94);color:var(--rojo);
    font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    border-radius:999px;padding:6px 13px;box-shadow:0 4px 12px rgba(0,0,0,.15);
  }
  .hg-medalla svg{width:14px;height:14px}

  /* lado del texto */
  .hg-cont{padding:38px 40px;display:flex;flex-direction:column;justify-content:center}
  @media(max-width:760px){.hg-cont{padding:30px 26px}}
  .hg-kicker{
    font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--acento);margin-bottom:12px;display:inline-flex;align-items:center;gap:7px;
  }
  .hg-kicker svg{width:15px;height:15px}
  .hg-nom{font-size:clamp(22px,3vw,28px);font-weight:600;line-height:1.18;margin:0 0 4px;letter-spacing:-.3px}
  .hg-meta{font-size:13.5px;color:var(--gris-cl);margin:0 0 16px}
  .hg-hook{font-size:15px;color:#3a3a3a;margin:0 0 22px;max-width:380px}
  .hg-fila{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .hg-precio b{font-size:24px;font-weight:600;color:var(--negro)}
  .hg-precio small{font-size:12px;color:var(--gris-cl);margin-left:5px}
  .hg-ir{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--rojo);color:#fff;font-size:14.5px;font-weight:600;
    border-radius:12px;padding:12px 22px;transition:background .18s,gap .18s;
  }
  .hg-ir svg{width:17px;height:17px}

  /* nota bajo la vitrina */
  .hg-pie{max-width:980px;margin:20px auto 0;padding:0 24px;text-align:center}
  .hg-pie p{font-size:12.5px;color:var(--gris-cl);display:inline-flex;align-items:center;gap:7px}
  .hg-pie svg{width:14px;height:14px;color:var(--acento)}

  /* ---------- barra fija inferior ---------- */
  .hg-barra{
    position:fixed;left:0;right:0;bottom:0;height:var(--barra-h);z-index:50;
    background:rgba(17,17,17,.96);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;gap:14px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  /* íconos de contacto: solo símbolos, sin texto */
  .hg-barra a, .hg-barra span.ico{
    display:inline-flex;align-items:center;justify-content:center;color:#fff;
    width:42px;height:42px;border-radius:50%;
    transition:background .15s,opacity .15s,transform .12s;
  }
  .hg-barra a{opacity:.9}
  .hg-barra a:hover{background:rgba(255,255,255,.12);opacity:1;transform:translateY(-2px)}
  .hg-barra a svg, .hg-barra span.ico svg{width:20px;height:20px}
  /* canales aún no disponibles: atenuados y sin clic */
  .hg-barra span.ico{opacity:.28;cursor:default}
</style>
</head>
<body>

<!-- header -->
<header class="hg-head">
  <div class="hg-marca">
    <img src="logo-mark-terracota.png" alt="MAGANDHI">
    <div class="hg-word">MAGANDHI</div>
    <div class="hg-tag">Hoy mereces lo mejor</div>
  </div>
</header>

<!-- intro (breve: el producto es el protagonista, no el manifiesto) -->
<div class="hg-intro">
  <h1>Ahora, <em>descúbrelo</em>.</h1>
</div>

<!-- vitrina: el producto elegido -->
<section class="hg-vitrina">
  <a class="hg-tarjeta" href="producto/grisi-manzanilla-gold/">
    <div class="hg-grid">
      <!-- panel rojo con la foto -->
      <div class="hg-foto">
        <span class="hg-medalla">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
          Elegido por MAGANDHI
        </span>
        <img src="productos/grisi-manzanilla-gold.png" alt="Shampoo Manzanilla GRISI Gold">
      </div>
      <!-- texto -->
      <div class="hg-cont">
        <span class="hg-kicker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg>
          Cuidado del cabello
        </span>
        <h2 class="hg-nom">Shampoo Manzanilla GRISI Gold</h2>
        <p class="hg-meta">Con extracto de cúrcuma · 400 mL</p>
        <p class="hg-hook">Un clásico del cuidado con manzanilla. Lo revisamos uno a uno: original, en fecha y en buen estado. Si no cumple, no entra.</p>
        <div class="hg-fila">
          <span class="hg-ir">
            Ver producto
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </span>
        </div>
      </div>
    </div>
  </a>
</section>

<!-- barra fija inferior: solo íconos de contacto -->
<nav class="hg-barra" aria-label="Canales de contacto">
  <!-- Correo (activo) -->
  <a href="mailto:contacto@magandhi.com" aria-label="Escríbenos por correo" title="Correo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
  </a>
  <!-- WhatsApp (activo) -->
  <a href="https://wa.me/573132451188" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp" title="WhatsApp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></svg>
  </a>
  <!-- Instagram (activo) -->
  <a href="https://instagram.com/magandhistore" target="_blank" rel="noopener" aria-label="Síguenos en Instagram" title="Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
  </a>
</nav>

</body>
</html>
