<!--
  MAGANDHI · portada / home de la tienda.
  · CSS autocontenido, prefijo hg-. Sin dependencias salvo la fuente.
  · Sistema de marca: paleta en marca.css. Negro #111, hueso/crema, Poppins.

  · COLOR = CATEGORIA (semantico, no decorativo). Cada producto pertenece a UNA
    categoria y cada categoria tiene UN color fijo de la familia MAGANDHI. El
    color NO distingue producto, distingue categoria. Como el home es un grid de
    pocas tarjetas de misma temperatura/saturacion, se lee "coleccion curada",
    nunca arcoiris. Cada tarjeta lleva el color de su categoria via variables
    inline (--acento / --acento-cl / --acento-sombra) sobre .hg-tarjeta.
    Esta es la base visual del futuro software "Campanas" (back-office).

  · PALETA DE CATEGORIAS (aprobada por el dueno, misma familia calida):
      Belleza femenina (rosa terroso)      #B5657A / #D99FAE / rgba(181,101,122,.16)
      Belleza masculina (grafito calido)   #3A3A3A / #7A7A7A / rgba(58,58,58,.14)
      Cuidado personal/general (topo)      #6E6A66 / #A8A29C / rgba(110,106,102,.15)
      Hogar/limpieza (azul petroleo)       #3E6B78 / #7FA6B0 / rgba(62,107,120,.15)
      Alimentos/naturales (terracota)      #C0682E / #E3A576 / rgba(192,104,46,.16)
      Destacado/clasico (rojo-terracota)   #B23A2E / #D98A80 / rgba(178,58,46,.15)
    El GRISI Gold conserva su DORADO de firma (#C9962E) para cuidado del cabello.

  · Fase actual: GRID de 5 productos. El primero (Grisi) es "producto estrella"
    y lleva una estrella DENTRO del sello "Elegido por MAGANDHI" (.hg-medalla__star).
    El sello SIEMPRE aparece; la estrella es OPCIONAL (simbolo con proposito para
    productos destacados) -> en Campanas sera un switch por producto.
    Solo el Grisi tiene pagina real; los otros 4 son productos de EJEMPLO/inventados
    (el dueno los ajustara desde el software Campanas) y enlazan a "#".
  · Barra fija inferior: solo iconos de contacto (centrado).
-->
<style>
  *{box-sizing:border-box}
  /* La paleta vive en marca.css (fuente unica). Aqui solo lo especifico del home. */
  :root{ --barra-h:60px; }
  html,body{margin:0;padding:0}
  body{
    background:var(--hueso);color:var(--tinta);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased;
    padding-bottom:var(--barra-h);
  }
  a{color:inherit;text-decoration:none}

  /* ---------- header ---------- */
  .hg-head{
    display:flex;align-items:center;justify-content:center;
    padding:26px 24px 6px;
  }
  .hg-marca{display:flex;flex-direction:column;align-items:center;gap:12px}
  .hg-marca img{width:76px;height:76px;display:block}
  /* wordmark: todo negro, centrado y AJUSTADO (letter-spacing menor = letras juntas) */
  .hg-word{
    font-weight:600;font-size:26px;letter-spacing:.16em;color:var(--negro);
    line-height:1;text-indent:.16em; /* compensa el spacing del ultimo caracter para centrar optico */
  }
  .hg-tag{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gris-cl);text-indent:.26em}

  /* ---------- intro corta ---------- */
  .hg-intro{max-width:620px;margin:14px auto 0;padding:0 24px;text-align:center}
  .hg-intro h1{
    font-size:clamp(24px,4vw,34px);font-weight:600;line-height:1.22;margin:0;letter-spacing:-.4px;
  }
  .hg-intro h1 em{font-style:normal;color:var(--rojo)}

  /* ---------- vitrina: grid de productos ---------- */
  .hg-vitrina{
    max-width:1100px;margin:34px auto 0;padding:0 24px;
  }
  .hg-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:22px;
  }
  /* TODAS las tarjetas del mismo tamano (incluida la estrella): quedan 3 arriba
     y 2 abajo, en orden. El producto estrella se distingue por su estrella y su
     color, no por el tamano. */
  @media(max-width:980px){
    .hg-grid{grid-template-columns:repeat(2,1fr)}
  }

  /* ---------- tarjeta de producto ---------- */
  /* Cada tarjeta define su color de categoria via --acento(-cl/-sombra) inline. */
  .hg-tarjeta{
    display:flex;flex-direction:column;position:relative;
    border-radius:20px;overflow:hidden;
    background:var(--blanco);border:1px solid var(--acento-sombra);
    box-shadow:0 14px 36px rgba(17,17,17,.07);
    transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
    cursor:pointer;height:100%;
  }
  .hg-tarjeta:hover{
    transform:translateY(-6px);
    box-shadow:0 26px 58px var(--acento-sombra);
    border-color:var(--acento-cl);
  }
  .hg-tarjeta:hover .hg-foto img{transform:scale(1.045)}
  .hg-tarjeta:hover .hg-ir{gap:12px}

  /* panel del color de la categoria (antes rojo fijo, ahora --acento por tarjeta) */
  .hg-foto{
    /* ALTURA FIJA (antes flex:1): asi el panel de color mide IGUAL en todas las
       tarjetas. Con flex:1 el panel crecia para rellenar el espacio sobrante en
       las tarjetas con menos texto (naranja/azul), quedando disparejo. */
    position:relative;flex:none;height:230px;
    background:
      radial-gradient(120% 90% at 50% 0%, var(--acento-cl) 0%, var(--acento) 58%, var(--acento) 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .hg-foto::after{ /* halo suave detras del producto */
    content:"";position:absolute;width:78%;height:78%;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 68%);
  }
  .hg-foto img{
    position:relative;max-height:230px;max-width:78%;object-fit:contain;
    filter:drop-shadow(0 20px 28px rgba(0,0,0,.26));
    transition:transform .35s ease;z-index:1;
  }
  /* placeholder dibujado (icono) para productos sin foto real */
  .hg-foto__ph{
    position:relative;z-index:1;display:flex;align-items:center;justify-content:center;
    width:120px;height:120px;border-radius:24px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);
    color:#fff;
  }
  .hg-foto__ph svg{width:52px;height:52px;opacity:.95}

  .hg-medalla{
    position:absolute;top:14px;left:14px;z-index:2;
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.94);color:var(--acento);
    font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border-radius:999px;padding:6px 12px;box-shadow:0 4px 12px rgba(0,0,0,.15);
  }
  .hg-medalla svg{width:13px;height:13px}

  /* estrella DENTRO del sello (producto destacado). Opcional: solo aparece si el
     producto la lleva (en Campanas sera un switch). Va rellena en el color de
     acento, resalta sobre el fondo blanco del sello en cualquier categoria. */
  .hg-medalla__star{width:13px;height:13px;flex:none}

  /* SELLO GEMELO para la zona blanca (solo movil): mismo sello, pero dentro del
     texto en vez de sobre la foto. Oculto en PC (alli manda el de la foto). Chip
     sobre fondo de acento suave para que resalte en cualquier color. */
  .hg-sello-abajo{
    display:none;align-items:center;gap:6px;align-self:flex-start;
    background:var(--acento-sombra);color:var(--acento);
    border:1px solid var(--acento-cl);border-radius:999px;
    font-size:8.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 10px;margin-top:2px;
  }
  .hg-sello-abajo svg{width:11px;height:11px;flex:none}
  .hg-sello-abajo .hg-medalla__star{width:10px;height:10px}

  /* lado del texto */
  .hg-cont{padding:22px 24px;display:flex;flex-direction:column;gap:2px;flex:1}
  .hg-kicker{
    font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--acento);margin-bottom:9px;display:inline-flex;align-items:center;gap:7px;
  }
  .hg-kicker svg{width:14px;height:14px}
  .hg-nom{font-size:clamp(17px,2vw,21px);font-weight:600;line-height:1.2;margin:0 0 3px;letter-spacing:-.3px}
  .hg-meta{font-size:12.5px;color:var(--gris-cl);margin:0 0 12px}
  .hg-hook{font-size:13.5px;color:#3a3a3a;margin:0 0 16px}
  .hg-fila{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:auto}
  .hg-precio b{font-size:19px;font-weight:600;color:var(--negro)}
  .hg-precio small{font-size:11.5px;color:var(--gris-cl);margin-left:5px}
  .hg-ir{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--acento);color:#fff;font-size:13.5px;font-weight:600;
    border-radius:11px;padding:10px 18px;transition:background .18s,gap .18s;
  }
  .hg-ir svg{width:16px;height:16px}

  /* ---------- aviso de urgencia (opcional, por producto) ----------
     "Solo X disponibles". Es un SWITCH por producto que el dueno enciende
     desde Campanas (aviso_urgencia_activo) definiendo el numero a mostrar
     (aviso_urgencia_cantidad). Tiene sentido conectado al inventario: se
     prende en el momento adecuado (por ejemplo cuando queden pocas unidades).
     DISENO: chip sobrio en el color de la categoria (nada de rojo de oferta ni
     urgencia agresiva), coherente con el alma boutique. Solo se pinta si el
     switch esta activo Y hay una cantidad valida (>0). */
  .hg-urgencia{
    display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    background:var(--acento-sombra);color:var(--acento);
    border:1px solid var(--acento-cl);border-radius:999px;
    font-size:11px;font-weight:600;letter-spacing:.02em;
    padding:5px 11px;margin:0 0 12px;
  }
  .hg-urgencia svg{width:13px;height:13px;flex:none}

  /* ============================================================
     MOVIL (<=760px): las tarjetas dejan de ser banner vertical y
     pasan a TARJETAS HORIZONTALES APILADAS: cuadrito de color a la
     IZQUIERDA (panel + icono/foto) y TEXTO a la DERECHA. Mismo grid,
     mismas tarjetas, solo cambia el layout por breakpoint.
     ============================================================ */
  @media(max-width:760px){
    /* ESCAPARATE 2 COLUMNAS (exclusivo movil): tarjetas verticales compactas, de
       a DOS por fila, que se "cortan" abajo = sensacion de "sigue bajando". En
       tono boutique MAGANDHI (sin ofertas ni urgencia). Cada tarjeta muestra solo
       lo esencial para no saturar: categoria (con su color) + nombre + sello. El
       hook, el precio y el boton NO se muestran aqui (se ven al entrar al producto). */
    .hg-vitrina{padding:0 12px}
    /* gap pequeno = tarjetas "en escala", con respiro minimo (aire boutique). */
    /* align-items:start = cada tarjeta mide segun SU contenido (no se estira a
       la altura de su vecina). Asi las de menos texto (ej. Serum rosa) quedan
       mas cortas y nace el ZIGZAG natural tipo Pinterest, sin forzar nada. */
    /* MASONRY REAL con multicolumna CSS (no Grid): 2 columnas verticales
       INDEPENDIENTES donde las tarjetas se apilan una tras otra. Cada tarjeta
       mide segun su contenido, asi que el desfase (zigzag tipo Pinterest) nace
       solo y se PROPAGA a todas -- sin huecos grandes ni filas rigidas. Al
       agregar productos, se acomodan solos. (CSS Grid arma filas alineadas: por
       eso antes solo se desfasaba la primera fila y quedaba el hueco.) */
    .hg-grid{
      display:block;column-count:2;column-gap:8px;
      grid-template-columns:none;
    }

    /* height:auto = la tarjeta se ajusta a su contenido; break-inside:avoid =
       no se parte entre columnas; margin-bottom = separacion vertical (en
       multicolumna no aplica gap entre elementos apilados). */
    .hg-tarjeta{
      flex-direction:column;height:auto;border-radius:14px;
      break-inside:avoid;-webkit-column-break-inside:avoid;
      margin-bottom:8px;
    }

    .hg-foto{flex:none;height:150px}
    .hg-foto img{max-height:130px;max-width:80%}
    .hg-foto__ph{width:84px;height:84px;border-radius:18px}
    .hg-foto__ph svg{width:38px;height:38px}
    .hg-medalla{
      top:9px;left:9px;padding:4px 9px;font-size:8px;gap:5px;letter-spacing:.04em;
    }
    .hg-medalla svg{width:11px;height:11px}
    .hg-medalla__star{width:10px;height:10px}

    .hg-cont{padding:12px 14px 15px;justify-content:flex-start;flex:1;min-width:0}
    .hg-kicker{margin-bottom:6px;font-size:9px;letter-spacing:.1em}
    .hg-nom{font-size:14.5px;line-height:1.25;margin:0 0 4px}
    /* SI mostramos la meta (el dato en gris oscurito, como en PC): da vida a la
       tarjeta y refuerza que es un PRODUCTO, no una categoria. */
    .hg-meta{display:block;font-size:11.5px;margin:0 0 9px;color:var(--gris)}
    /* se ocultan hook, precio, boton y aviso de urgencia en movil (se ven al
       entrar al producto; el escaparate movil muestra solo lo esencial) */
    .hg-hook,
    .hg-urgencia,
    .hg-fila{display:none}

    /* SELLO 'Elegido por MAGANDHI' NO sobre la foto (ocupa mucho): en movil se
       oculta el que va sobre la imagen y se muestra el gemelo de la zona blanca. */
    .hg-foto .hg-medalla{display:none}
    .hg-sello-abajo{display:inline-flex}
  }

  /* ---------- barra fija inferior ---------- */
  .hg-barra{
    position:fixed;left:0;right:0;bottom:0;height:var(--barra-h);z-index:50;
    background:rgba(17,17,17,.96);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;gap:14px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  /* iconos de contacto: solo simbolos, sin texto */
  .hg-barra a, .hg-barra span.ico{
    display:inline-flex;align-items:center;justify-content:center;color:#fff;
    width:42px;height:42px;border-radius:50%;
    transition:background .15s,opacity .15s,transform .12s;
  }
  .hg-barra a{opacity:.9}
  .hg-barra a:hover{background:rgba(255,255,255,.12);opacity:1;transform:translateY(-2px)}
  .hg-barra a svg, .hg-barra span.ico svg{width:20px;height:20px}
  /* canales aun no disponibles: atenuados y sin clic */
  .hg-barra span.ico{opacity:.28;cursor:default}
</style>
</head>
<body>

<!-- header -->
<header class="hg-head">
  <div class="hg-marca">
    <img src="logo-mark-terracota.png" alt="MAGANDHI">
    <div class="hg-word">MAGANDHI</div>
    <div class="hg-tag">Hoy mereces lo mejor</div>
  </div>
</header>

<!-- intro (breve: el producto es el protagonista, no el manifiesto) -->
<div class="hg-intro">
  <h1>Ahora, <em>descúbrelo</em>.</h1>
</div>

<!-- vitrina: grid de productos (color = categoria) -->
<section class="hg-vitrina">
  <!-- GRID DINAMICO: las tarjetas se pintan desde Supabase (vista catalogo_publico)
       manteniendo EXACTO el marcado/estilos aprobados. El render (mismo marcado,
       clases y variables de color que las tarjetas originales) vive en el
       <script type=module> del final de la pagina. Si no hay datos o falla la
       consulta, el grid queda vacio sin romper la pagina. -->
  <div class="hg-grid" id="hg-grid" aria-live="polite"></div>

  <!-- NOTA MANTENIMIENTO: aqui vivian las 5 tarjetas originales dentro de un
       <template id="hg-plantilla-referencia"> inerte que nunca se instanciaba
       (codigo muerto). Se elimino: el grid #hg-grid se pinta ENTERAMENTE desde
       catalogo_publico en el <script type=module> del final de la pagina,
       reproduciendo EXACTO las clases y variables de color aprobadas. No se
       pierde nada visual. -->

  <!-- nota: la vitrina se llena desde Campanas; los productos sin pagina propia
       enlazan a "#" (el dueno los ajusta desde el software Campanas) -->
</section>

<!-- ============================================================
     RENDER DINAMICO DE LA VITRINA (desde Campanas / Supabase)
     ------------------------------------------------------------
     · Lee SOLO la vista publica catalogo_publico (productos publicados y
       campos publicos). Nunca toca tablas internas ni etiquetas.
     · Reproduce EXACTO el marcado/clases de las tarjetas aprobadas: mismo
       sistema color=categoria (variables inline --acento/--acento-cl/
       --acento-sombra), sello condicional, estrella condicional, sello-abajo
       (movil), placeholder cuando no hay imagen.
     · Aviso de urgencia "Solo X disponibles": switch por producto que el dueno
       enciende desde Campanas (aviso_urgencia_activo + aviso_urgencia_cantidad).
     · Si la consulta falla o no hay datos, degrada sobrio sin romper la pagina.
     ============================================================ -->
<script type="module">
  import { supabase } from './supabase-config.js';

  // Nombre del bucket publico de Campanas donde viven las imagenes de producto.
  const BUCKET_CAMPANAS = 'campanas';

  // Escapa texto que venga de datos antes de inyectarlo como HTML (este repo no
  // tiene un core compartido, asi que el helper vive aqui).
  function esc(v){
    if(v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // Resuelve la URL publica de un path del bucket 'campanas'. Si el path ya es
  // una URL absoluta (http...), se devuelve tal cual (compatibilidad con datos
  // viejos que hubieran guardado una URL en vez de un key).
  function urlPublica(path){
    if(!path) return '';
    if(/^https?:\/\//i.test(path)) return path;
    const { data } = supabase.storage.from(BUCKET_CAMPANAS).getPublicUrl(path);
    return (data && data.publicUrl) || '';
  }

  // Deriva el path de la version LIVIANA ('-sm') a partir del path GRANDE, segun
  // la convencion de subida del panel de Campanas: la galeria sube dos objetos
  // por imagen con la MISMA base, la grande como '<base>.<ext>' y la liviana
  // como '<base>-sm.<ext>'. Asi el grid del home puede pedir la liviana SIN
  // cambiar el esquema ni la vista (que solo trae el path grande en 'imagenes').
  // Si el path ya es una URL absoluta o no tiene extension reconocible, no se
  // toca (no hay liviana derivable). El fallback a la grande se hace en el
  // <img onerror> por si la liviana no existiese en Storage.
  function pathLiviana(pathGrande){
    if(!pathGrande || /^https?:\/\//i.test(pathGrande)) return '';
    const punto = pathGrande.lastIndexOf('.');
    if(punto <= 0) return '';
    const base = pathGrande.slice(0, punto);
    const ext  = pathGrande.slice(punto + 1);
    if(base.endsWith('-sm')) return pathGrande; // ya es liviana
    return base + '-sm.' + ext;
  }

  // Devuelve { liviana, grande } de URLs publicas para la FOTO del grid. Prefiere
  // la primera imagen de la galeria (arreglo 'imagenes', que tiene version -sm);
  // si no hay galeria, cae al banner (imagen_banner_path, que NO tiene -sm, asi
  // que su liviana = grande). El grid pide la liviana y cae a la grande via
  // onerror. Objetivo del dueno: calidad en la pagina de producto (usa la
  // grande) SIN penalizar la carga del grid/miniaturas (usan la liviana).
  function fotosGrid(fila){
    let grandePath = '';
    let esGaleria = false; // true = primer elemento de 'imagenes' (tiene -sm); false = banner (sin -sm)
    if(Array.isArray(fila.imagenes) && fila.imagenes.length && fila.imagenes[0]){
      grandePath = fila.imagenes[0];
      esGaleria = true;
    } else if(fila.imagen_banner_path){
      grandePath = fila.imagen_banner_path;
    }
    if(!grandePath) return { liviana: '', grande: '' };
    const grande = urlPublica(grandePath);
    // Solo la galeria sube una version '-sm'; el banner se sube con una sola key
    // sin sufijo. Por eso solo derivamos la liviana '-sm' cuando el origen es la
    // galeria; para el banner liviana = grande (no pedir una liviana inexistente).
    let liviana = grande;
    if(esGaleria){
      const svPath = pathLiviana(grandePath);
      if(svPath) liviana = urlPublica(svPath) || grande;
    }
    return { liviana: liviana || grande, grande };
  }

  // Formatea el precio como en el diseno aprobado: "$ 24.900" (miles con punto).
  function formatearPrecio(valor){
    const n = Number(valor);
    if(!Number.isFinite(n)) return '';
    return '$ ' + Math.round(n).toLocaleString('es-CO');
  }

  // ENLACE DE CADA TARJETA A SU PAGINA DE PRODUCTO.
  // Ahora existe UNA plantilla generica (producto/index.html) que se llena sola
  // leyendo catalogo_publico por el ?slug= o ?id= de la URL. Por eso TODAS las
  // tarjetas (incluido el Grisi) enlazan a la generica: 'producto/?slug=<slug>'
  // si la fila trae slug, si no 'producto/?id=<uuid>'. Ninguna queda en '#'.
  // DECISION: apuntar tambien el Grisi a la generica es lo mas simple y coherente
  // (una sola pagina que mantener); su carpeta antigua
  // (producto/grisi-manzanilla-gold/) se conserva como compatibilidad para que su
  // URL actual NO de 404. El id (uuid) es la clave ESTABLE de respaldo: el nombre
  // puede cambiar desde el panel de Campanas, el id no.
  function hrefProducto(fila){
    if(fila.slug) return 'producto/?slug=' + encodeURIComponent(fila.slug);
    if(fila.id)   return 'producto/?id=' + encodeURIComponent(fila.id);
    return '#';
  }

  // Icono neutral para el kicker de categoria (el diseno usa un simbolo pequeno;
  // aqui va uno unico y sobrio, ya que el icono no viaja en catalogo_publico).
  const ICONO_KICKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg>';
  const ICONO_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>';
  const ICONO_ESTRELLA = '<svg class="hg-medalla__star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 3 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.9 21l1.2-6.8-5-4.9 6.9-1z"/></svg>';
  const ICONO_FLECHA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
  const ICONO_CAJA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7 12 3 4 7v10l8 4 8-4z"/><path d="m4 7 8 4 8-4"/><path d="M12 11v10"/></svg>';
  // Placeholder dibujado para productos sin foto real (como en el diseno actual).
  const ICONO_PH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>';

  // Sello "Elegido por MAGANDHI" (con estrella opcional). Reproduce el marcado
  // aprobado: sobre la foto en PC, gemelo en la zona blanca para movil.
  function selloFoto(estrella){
    const clase = estrella ? 'hg-medalla hg-medalla--estrella' : 'hg-medalla';
    return '<span class="' + clase + '">' +
      (estrella ? ICONO_ESTRELLA : '') + ICONO_CHECK + ' Elegido por MAGANDHI</span>';
  }
  function selloAbajo(estrella){
    const clase = estrella ? 'hg-sello-abajo hg-medalla--estrella' : 'hg-sello-abajo';
    return '<span class="' + clase + '">' +
      (estrella ? ICONO_ESTRELLA : '') + ICONO_CHECK + ' Elegido por MAGANDHI</span>';
  }

  // Aviso de urgencia: solo si el switch esta activo y hay cantidad valida (>0).
  function avisoUrgencia(fila){
    if(!fila.aviso_urgencia_activo) return '';
    const cant = Number(fila.aviso_urgencia_cantidad);
    if(!Number.isFinite(cant) || cant <= 0) return '';
    const texto = 'Solo ' + cant + (cant === 1 ? ' disponible' : ' disponibles');
    return '<span class="hg-urgencia">' + ICONO_CAJA + esc(texto) + '</span>';
  }

  function tarjeta(fila){
    const href = hrefProducto(fila);
    const acento  = fila.color_fuerte  || '#B23A2E';
    const acentoCl = fila.color_claro  || '#D98A80';
    const acentoSb = fila.color_sombra || 'rgba(178,58,46,.15)';
    const estilo = '--acento:' + esc(acento) + ';--acento-cl:' + esc(acentoCl) +
                   ';--acento-sombra:' + esc(acentoSb);

    // Zona de la foto: imagen real si el producto la trae; si no, placeholder.
    // Se pide la version LIVIANA (-sm) para no penalizar la carga del grid; si
    // esa liviana no existe en Storage, el onerror cae a la version grande (y si
    // la grande tampoco existe, un segundo onerror muestra el placeholder). La
    // pagina de producto en cambio usa la grande (calidad boutique).
    const foto = fotosGrid(fila);
    const phMarkup = '<span class="hg-foto__ph" aria-hidden="true">' + ICONO_PH + '</span>';
    let img;
    if(foto.liviana){
      const fbGrande = (foto.grande && foto.grande !== foto.liviana)
        ? "this.onerror=null;this.src='" + foto.grande.replace(/'/g, "\\'") + "'"
        : "this.onerror=null;this.remove()";
      img = '<img src="' + esc(foto.liviana) + '" alt="' + esc(fila.nombre) + '" ' +
        'loading="lazy" onerror="' + esc(fbGrande) + '">';
    } else {
      img = phMarkup;
    }

    return '' +
    '<a class="hg-tarjeta" href="' + esc(href) + '" style="' + estilo + '">' +
      '<div class="hg-foto">' +
        (fila.sello_elegido ? selloFoto(fila.estrella) : '') +
        img +
      '</div>' +
      '<div class="hg-cont">' +
        '<span class="hg-kicker">' + ICONO_KICKER + ' ' + esc(fila.categoria_nombre || '') + '</span>' +
        '<h2 class="hg-nom">' + esc(fila.nombre) + '</h2>' +
        '<p class="hg-meta">' + esc(fila.detalle_presentacion || '') + '</p>' +
        '<p class="hg-hook">' + esc(fila.hook_corto || '') + '</p>' +
        avisoUrgencia(fila) +
        '<div class="hg-fila">' +
          '<span class="hg-precio"><b>' + esc(formatearPrecio(fila.precio_venta)) + '</b><small>COP</small></span>' +
          '<span class="hg-ir">Ver producto' + ICONO_FLECHA + '</span>' +
        '</div>' +
        (fila.sello_elegido ? selloAbajo(fila.estrella) : '') +
      '</div>' +
    '</a>';
  }

  async function pintarVitrina(){
    const grid = document.getElementById('hg-grid');
    if(!grid) return;
    try{
      const { data, error } = await supabase
        .from('catalogo_publico')
        .select('*')
        .order('orden', { ascending: true });
      if(error) throw error;
      if(!data || data.length === 0){
        // Sin datos: degradar sobrio, sin romper la pagina.
        grid.innerHTML = '';
        return;
      }
      grid.innerHTML = data.map(tarjeta).join('');
    }catch(e){
      // Falla de red/consulta: no romper el home; dejar la vitrina vacia.
      console.error('No se pudo cargar la vitrina desde Campanas:', e);
      grid.innerHTML = '';
    }
  }

  pintarVitrina();
</script>
