<script>
(function(){
  var url = new URL(window.location.href);
  window.__MG_AUTH_CALLBACK__ = {
    code: url.searchParams.get('code'),
    tokenHash: url.searchParams.get('token_hash'),
    tokenType: url.searchParams.get('type'),
    flow: url.searchParams.get('flow') || 'oauth',
    error: url.searchParams.get('error') || url.searchParams.get('error_description')
  };
  ['code','token_hash','type','error','error_code','error_description'].forEach(function(key){ url.searchParams.delete(key); });
  url.hash = '';
  history.replaceState(null, '', url.pathname + url.search);
})();
</script>
