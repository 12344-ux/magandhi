<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  MAGANDHI · Redirect de compatibilidad.
  Esta URL antigua (producto/grisi-manzanilla-gold/) se conserva SOLO para que no
  de 404 a quien la tenga guardada o enlazada. La pagina de producto real es la
  plantilla generica producto/?id=... que se llena EN VIVO desde catalogo_publico.
  Antes aqui vivia una copia completa de la pagina (819 lineas) con un precio
  escrito a mano que, si Supabase fallaba, se mostraba como real. Se reemplazo por
  este redirect: el precio y todos los datos ahora salen siempre de la base.
  El id es la clave ESTABLE del producto (el nombre puede cambiar; el id no).
-->
<title>Redirigiendo… · MAGANDHI</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://magandhi.com/producto/?id=00000000-0000-0000-0000-0000000c0001">
<meta http-equiv="refresh" content="0; url=../?id=00000000-0000-0000-0000-0000000c0001">
<script>
  // Redirect inmediato por JS (mas rapido que el meta refresh y conserva el
  // esquema/host). Fallback: el <meta refresh> de arriba y el enlace de abajo.
  location.replace('../?id=00000000-0000-0000-0000-0000000c0001');
</script>
</head>
<body>
  <p>Redirigiendo al producto…
     <a href="../?id=00000000-0000-0000-0000-0000000c0001">Continuar</a></p>
</body>
</html>
